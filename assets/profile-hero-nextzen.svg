<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Mopara Pair Ayat Next-Zen Profile Hero</title>
  <desc id="desc">A futuristic GitHub profile hero for Mopara Pair Ayat with full-stack systems, AI/ML engineering, and cloud-native architecture themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.42" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.48" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="edgeAnimated" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#7c3aed;#f97316;#10b981;#38bdf8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.34" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#f97316;#10b981;#38bdf8;#7c3aed" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.68" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#38bdf8;#7c3aed;#f97316;#10b981" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#10b981;#38bdf8;#7c3aed;#f97316" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#334155" stroke-width="1" opacity="0.34"/>
    </pattern>
  </defs>

  <rect width="1400" height="320" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="320" rx="30" fill="url(#grid)" opacity="0.5"/>
  <rect x="2" y="2" width="1396" height="316" rx="30" fill="none" stroke="url(#edge)" stroke-width="3" opacity="0.7"/>
  <rect x="5" y="5" width="1390" height="310" rx="28" fill="none" stroke="url(#edgeAnimated)" stroke-width="3.5" stroke-dasharray="420 120" stroke-linecap="round" opacity="0.95">
    <animate attributeName="stroke-dashoffset" values="0;-1080" dur="8s" repeatCount="indefinite"/>
  </rect>

  <circle cx="118" cy="88" r="138" fill="url(#blueGlow)"/>
  <circle cx="1260" cy="236" r="160" fill="url(#violetGlow)"/>

  <g opacity="0.82" filter="url(#glow)">
    <path d="M72 224 C210 132 310 206 444 110 S646 74 760 124 S945 223 1088 130 S1234 78 1338 118" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M92 87 C232 135 294 52 425 86 S620 178 758 74 S988 70 1114 166 S1260 229 1350 188" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
    <path d="M148 274 C320 236 466 272 642 222 S924 252 1074 216 S1268 182 1350 232" fill="none" stroke="#10b981" stroke-width="2.4"/>
  </g>

  <g fill="#e2e8f0" stroke="url(#edge)" stroke-width="2" filter="url(#glow)">
    <circle cx="72" cy="224" r="7"/>
    <circle cx="444" cy="110" r="7"/>
    <circle cx="760" cy="124" r="7"/>
    <circle cx="1088" cy="130" r="7"/>
    <circle cx="1338" cy="118" r="7"/>
    <circle cx="425" cy="86" r="6"/>
    <circle cx="758" cy="74" r="6"/>
    <circle cx="1114" cy="166" r="6"/>
    <circle cx="642" cy="222" r="6"/>
  </g>

  <g transform="translate(176 54)">
    <rect x="0" y="0" width="1048" height="212" rx="28" fill="#020617" opacity="0.9" stroke="url(#edge)" stroke-width="2"/>
    <rect x="2" y="2" width="1044" height="208" rx="26" fill="none" stroke="url(#edgeAnimated)" stroke-width="2.5" stroke-dasharray="260 86" stroke-linecap="round" opacity="0.95">
      <animate attributeName="stroke-dashoffset" values="0;780" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="30" width="988" height="7" rx="3.5" fill="url(#edgeAnimated)" opacity="0.95"/>
    <text x="524" y="98" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#f8fafc">Mopara Pair Ayat</text>
    <text x="524" y="139" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#93c5fd">Full-Stack Systems • AI/ML Engineering • Cloud-Native Architecture</text>
    <text x="524" y="171" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Building scalable systems, AI-powered products, and production-grade digital platforms</text>

    <g transform="translate(251 187)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="800">
      <rect x="0" y="0" width="110" height="26" rx="13" fill="#0f172a" stroke="#38bdf8"/>
      <text x="55" y="17" text-anchor="middle" fill="#7dd3fc">SECURE</text>
      <rect x="132" y="0" width="118" height="26" rx="13" fill="#0f172a" stroke="#7c3aed"/>
      <text x="191" y="17" text-anchor="middle" fill="#c4b5fd">SCALABLE</text>
      <rect x="272" y="0" width="138" height="26" rx="13" fill="#0f172a" stroke="#10b981"/>
      <text x="341" y="17" text-anchor="middle" fill="#86efac">AI-NATIVE</text>
      <rect x="432" y="0" width="132" height="26" rx="13" fill="#0f172a" stroke="#f97316"/>
      <text x="498" y="17" text-anchor="middle" fill="#fdba74">CLOUD-READY</text>
    </g>
  </g>

  <g opacity="0.9">
    <rect x="82" y="62" width="48" height="48" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <path d="M98 86 h17 m-8 -8 v16" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <rect x="1270" y="64" width="48" height="48" rx="14" fill="#0f172a" stroke="#7c3aed"/>
    <path d="M1285 90 c12 -20 26 -20 38 0" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <rect x="88" y="236" width="52" height="52" rx="16" fill="#0f172a" stroke="#10b981"/>
    <path d="M104 262 h22 m-11 -11 v22" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <rect x="1264" y="226" width="56" height="56" rx="16" fill="#0f172a" stroke="#f97316"/>
    <path d="M1280 254 h24 l10 14" fill="none" stroke="#fdba74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
