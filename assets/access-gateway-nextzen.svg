<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="230" viewBox="0 0 1400 230" role="img" aria-labelledby="title desc">
  <title id="title">Next-Zen Access Gateway</title>
  <desc id="desc">A sleek profile access panel with Islamic greeting, identity, and production-grade engineering signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#334155" stroke-width="1" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1400" height="230" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="230" rx="26" fill="url(#grid)" opacity="0.55"/>
  <rect x="2" y="2" width="1396" height="226" rx="26" fill="none" stroke="url(#line)" stroke-width="2" opacity="0.78"/>

  <circle cx="174" cy="52" r="126" fill="url(#glowA)"/>
  <circle cx="1236" cy="178" r="130" fill="url(#glowB)"/>

  <g opacity="0.78" filter="url(#soft)">
    <path d="M92 165 C220 92 328 154 472 92 S726 78 894 138 S1160 178 1308 95" fill="none" stroke="#38bdf8" stroke-width="2.4"/>
    <path d="M132 64 C286 118 422 46 575 88 S834 180 1044 84 S1230 72 1326 132" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <path d="M126 202 C315 174 468 206 650 172 S970 186 1276 202" fill="none" stroke="#10b981" stroke-width="2"/>
  </g>

  <g transform="translate(156 32)">
    <rect width="1088" height="166" rx="24" fill="#020617" opacity="0.92" stroke="url(#line)" stroke-width="1.5"/>
    <rect x="30" y="26" width="1028" height="5" rx="2.5" fill="url(#line)"/>
    <text x="544" y="69" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#e5e7eb">السَّلاَمُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ</text>
    <text x="544" y="100" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Assalamu'alaikum warahmatullahi wabarakatuh</text>
    <text x="544" y="126" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-style="italic" fill="#cbd5e1">May the peace, mercy, and blessings of Allah be with you.</text>
    <text x="544" y="153" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#93c5fd">Full-Stack Developer • AI/ML Engineer • Systems Thinker</text>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="800">
    <rect x="72" y="24" width="138" height="26" rx="13" fill="#0f172a" stroke="#38bdf8"/>
    <text x="141" y="41" text-anchor="middle" fill="#7dd3fc">ACCESS ONLINE</text>
    <rect x="1190" y="24" width="138" height="26" rx="13" fill="#0f172a" stroke="#10b981"/>
    <text x="1259" y="41" text-anchor="middle" fill="#86efac">BUILD READY</text>
    <rect x="76" y="182" width="150" height="26" rx="13" fill="#0f172a" stroke="#7c3aed"/>
    <text x="151" y="199" text-anchor="middle" fill="#c4b5fd">AI-NATIVE FLOW</text>
    <rect x="1172" y="182" width="156" height="26" rx="13" fill="#0f172a" stroke="#f97316"/>
    <text x="1250" y="199" text-anchor="middle" fill="#fdba74">PRODUCTION MODE</text>
  </g>
</svg>
